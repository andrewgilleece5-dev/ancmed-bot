<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diplomacy vs. Bots</title>
  <!-- ?v=N is a manual cache-buster: bump both below whenever app.js/style.css
       change, so a browser that already cached the old files picks up the new
       ones on the next visit instead of silently running stale code. -->
  <link rel="stylesheet" href="/style.css?v=5" />
</head>
<body>
  <header>
    <h1>Diplomacy <span class="dim">vs.</span> Bots</h1>
    <div id="status" class="status"></div>
    <button id="new-game-btn" class="ghost" hidden>New game</button>
  </header>

  <main>
    <!-- setup -->
    <section id="setup" class="panel">
      <h2>New game</h2>
      <label>Map
        <select id="map-select"></select>
      </label>
      <label>Play as
        <select id="power-select"></select>
      </label>
      <label>Bot difficulty
        <select id="difficulty-select"></select>
      </label>
      <p id="map-note" class="note"></p>
      <button id="start-btn">Start game</button>
      <p class="note err" id="setup-error" hidden></p>
    </section>

    <!-- game -->
    <section id="game" class="game" hidden>
      <div class="board-col">
        <div class="timebar" id="timebar" hidden>
          <button id="hist-prev" class="ghost" title="Previous phase">◀</button>
          <input type="range" id="hist-slider" min="0" max="0" value="0" />
          <button id="hist-next" class="ghost" title="Next phase">▶</button>
          <span id="hist-label" class="hist-label"></span>
        </div>
        <p class="note" id="map-hint">Click one of your units to give it an order.</p>
        <div class="board"><div id="map-holder"></div></div>
      </div>
      <div id="order-menu" class="order-menu" hidden></div>

      <aside class="side">
        <div id="banner" class="banner" hidden></div>

        <div class="card">
          <h3>Supply centres</h3>
          <table id="sc-table"></table>
          <p class="note" id="win-note"></p>
        </div>

        <div class="card" id="orders-card">
          <h3 id="orders-title">Orders</h3>
          <p class="note" id="orders-hint"></p>
          <div id="orders-list"></div>
          <button id="submit-btn">Submit orders</button>
        </div>

        <div class="card" id="history-note" hidden>
          <p>Viewing <strong id="history-note-label"></strong>.</p>
          <button id="return-current">Return to current turn ▸</button>
        </div>

        <details class="card" id="results-card">
          <summary>Last phase</summary>
          <div id="results-body"></div>
        </details>
      </aside>
    </section>
  </main>

  <footer>
    Built on the AGPL-3.0
    <a href="https://github.com/diplomacy/diplomacy" target="_blank" rel="noopener">diplomacy</a>
    engine. <a id="source-link" href="#" target="_blank" rel="noopener">Source</a>.
  </footer>

  <div id="overlay" class="overlay" hidden><div class="spinner"></div><span>Bots are moving&hellip;</span></div>

  <script src="/app.js?v=5"></script>
</body>
</html>
